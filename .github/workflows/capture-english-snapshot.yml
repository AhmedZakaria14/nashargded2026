name: Capture English source snapshot

on:
  push:
    paths:
      - '.github/workflows/capture-english-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch English homepage
        run: |
          set -e
          curl -L --fail --retry 4 --retry-delay 2 --connect-timeout 15 --max-time 90 \
            -A 'Mozilla/5.0 (compatible; NasharSnapshotBot/1.0)' \
            'https://adselams.com/en/' -o source-snapshot-en.html
          test -s source-snapshot-en.html
          grep -qi '<html' source-snapshot-en.html
          grep -qi 'Be where the world is heading\|ADSELA' source-snapshot-en.html
      - name: Commit snapshot if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source-snapshot-en.html
          if git diff --cached --quiet; then
            echo 'No snapshot changes.'
            exit 0
          fi
          git commit -m 'Capture English homepage snapshot'
          git push
