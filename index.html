<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
  <meta name="theme-color" content="#07100c">
  <meta name="application-name" content="النشار جروب">
  <meta name="apple-mobile-web-app-title" content="النشار جروب">
  <meta name="description" content="النشار جروب شريك نمو رقمي متكامل يقدم خدمات التسويق الرقمي، الإعلانات، تحسين محركات البحث، تصميم وتطوير المواقع، التجارة الإلكترونية والهوية الإبداعية في السعودية والخليج.">
  <title>النشار جروب | وكالة تسويق رقمي في السعودية والخليج</title>
  <link rel="icon" type="image/svg+xml" href="/assets/elnashargroup-icon-v3.svg">
  <style>html,body{margin:0;background:#000;min-height:100%;color:#fff}#boot{position:fixed;inset:0;background:#000;z-index:2147483647}</style>
<link rel="stylesheet" href="/assets-fix.css?v=3"></head>
<body>
<div id="boot" aria-hidden="true"></div>
<script>
(async()=>{
  try{
    const BRAND='النشار جروب';
    const ALT_BRAND='ELNASHARGROUP';
    const FULL='/assets/elnashargroup-logo-v3.svg';
    const ICON='/assets/elnashargroup-icon-v3.svg';
    const ORIGIN='https://adselams.com/';
    const SITE=location.origin;
    const PATH=location.pathname||'/';
    const IS_HOME=PATH==='/'||PATH==='/home-v4.html'||PATH==='/index.html';
    const HOME_TITLE='النشار جروب | وكالة تسويق رقمي في السعودية والخليج';
    const DEFAULT_DESC='النشار جروب شريك نمو رقمي متكامل يقدم خدمات التسويق الرقمي، الإعلانات، تحسين محركات البحث، تصميم وتطوير المواقع، التجارة الإلكترونية والهوية الإبداعية في السعودية والخليج.';
    const brandText=v=>!v?v:v.replace(/[\w.+-]+@(?:adselams\.com|nashar\.digital)/gi,BRAND).replace(/Adsela\s+Marketing\s+Solutions/gi,BRAND).replace(/\bAdsela\b/gi,BRAND).replace(/أدسيلا|ادسيلا/g,BRAND).replace(/نشار\s+ديجيتال/g,BRAND).replace(/Nashar\s+Digital/gi,BRAND).replace(/\bELNASHARGROUP\b/gi,BRAND).replace(/(?:www\.)?adselams\.com/gi,BRAND).replace(/(?:www\.)?nashar\.digital/gi,BRAND);
    const proxy=u=>{
      if(!u||typeof u!=='string')return u;
      const s=u.trim();
      if(s.startsWith('https://adselams.com/'))return '/origin/'+s.slice(ORIGIN.length);
      if(s.startsWith('http://adselams.com/'))return '/origin/'+s.slice('http://adselams.com/'.length);
      if(s.startsWith('//adselams.com/'))return '/origin/'+s.slice('//adselams.com/'.length);
      return s;
    };
    const setProxy=v=>!v?v:v.split(',').map(part=>{const bits=part.trim().split(/\s+/);if(bits[0])bits[0]=proxy(bits[0]);return bits.join(' ')}).join(', ');

    /* Homepage HTML is now an immutable local snapshot. Internal pages keep the cloned design and are branded before first paint. */
    const sourceUrl=IS_HOME?'/source-snapshot.html?brand=nashar-static-v1':('/origin'+PATH+(location.search||''));
    const r=await fetch(sourceUrl,{cache:'no-store',headers:{'Cache-Control':'no-cache'}});
    if(!r.ok)throw new Error('source '+r.status+' '+sourceUrl);
    let h=await r.text();

    const fullRe=/(?:https?:\/\/adselams\.com\/)?(?:\.\/|\/)?wp-content\/uploads\/[^\"'()<>=\s]*(?:Adsela-Logo|adsela(?:[-_ ]?new)?[-_ ]?logo\d*|logo-png-white-01)[^\"'()<>=\s]*/gi;
    const iconRe=/(?:https?:\/\/adselams\.com\/)?(?:\.\/|\/)?wp-content\/uploads\/[^\"'()<>=\s]*(?:adsela-icon-footer\d*|logo[-_ ]adsela[-_ ]half(?:[-_ ]right)?|cropped-fav-icon)[^\"'()<>=\s]*/gi;
    h=h.replace(fullRe,FULL).replace(iconRe,ICON);

    const d=new DOMParser().parseFromString(h,'text/html');
    d.documentElement.dataset.brand='nashar-group';
    const mediaAttrs=['src','data-src','data-lazy-src','data-original','data-lazyload','poster','data-poster','data-bg','data-bg-hidpi','data-background-image','data-dce-background-image-url','data-dce-background-overlay-image-url'];
    d.querySelectorAll('*').forEach(el=>{
      mediaAttrs.forEach(a=>{const v=el.getAttribute(a);if(v)el.setAttribute(a,proxy(v))});
      ['srcset','data-srcset','data-lazy-srcset'].forEach(a=>{const v=el.getAttribute(a);if(v)el.setAttribute(a,setProxy(v))});
      const style=el.getAttribute('style');
      if(style&&/https?:\/\/adselams\.com\//i.test(style))el.setAttribute('style',style.replace(/https?:\/\/adselams\.com\//gi,'/origin/'));
    });
    d.querySelectorAll('link[href]').forEach(link=>{
      const rel=(link.getAttribute('rel')||'').toLowerCase();
      if(/stylesheet|preload|icon/.test(rel))link.setAttribute('href',proxy(link.getAttribute('href')));
    });

    const skip=new Set(['SCRIPT','STYLE','NOSCRIPT','CODE','PRE','TEXTAREA']);
    const walker=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT,{acceptNode(node){const p=node.parentElement;return p&&!skip.has(p.tagName)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});
    let tn;while((tn=walker.nextNode())){const n=brandText(tn.nodeValue);if(n!==tn.nodeValue)tn.nodeValue=n}
    d.querySelectorAll('[alt],[title],[aria-label],[placeholder]').forEach(el=>['alt','title','aria-label','placeholder'].forEach(a=>{const v=el.getAttribute(a);if(v){const n=brandText(v);if(n!==v)el.setAttribute(a,n)}}));

    d.querySelectorAll('a[href]').forEach(a=>{
      const href=a.getAttribute('href')||'';
      if(/^mailto:[^?]*@(adselams\.com|nashar\.digital)/i.test(href)){a.setAttribute('href','/contact-us/');a.removeAttribute('target');a.setAttribute('aria-label','تواصل مع '+BRAND);if(a.childElementCount===0)a.textContent='تواصل مع '+BRAND;return}
      if(/^https?:\/\/adselams\.com\//i.test(href)){try{const u=new URL(href);a.setAttribute('href',u.pathname+u.search+u.hash)}catch(e){};return}
      if(/(?:facebook|instagram|twitter|x|linkedin|tiktok|youtube|snapchat)\.com\/[^"']*adsela/i.test(href)){a.setAttribute('href','/');a.removeAttribute('target');a.setAttribute('aria-label',BRAND)}
    });

    const cleanImg=(img,src)=>{
      img.setAttribute('src',src);img.setAttribute('alt',BRAND);
      ['srcset','data-src','data-lazy-src','data-original','data-srcset','data-lazy-srcset','data-sizes','loading','width','height'].forEach(a=>img.removeAttribute(a));
      img.dataset.elnasharBrand=src===FULL?'logo':'icon';
    };
    d.querySelectorAll('.header__logo-2 img,.offcanvas__logo img,.footer__logo img,.footer__logo-2 img,.site-header .brand img,header img[alt="logo"],header img[alt="ELNASHARGROUP"],header img[alt="النشار جروب"],footer img[alt="logo"],footer img[alt="ELNASHARGROUP"],footer img[alt="النشار جروب"]').forEach(img=>cleanImg(img,FULL));
    d.querySelectorAll('.header__logo-2 source,.offcanvas__logo source,.footer__logo source,.footer__logo-2 source').forEach(s=>{s.setAttribute('srcset',FULL);s.removeAttribute('data-srcset');s.removeAttribute('data-lazy-srcset')});
    d.querySelectorAll('.header__logo-2 a,.offcanvas__logo a,.footer__logo a,.footer__logo-2 a,.site-header .brand').forEach(a=>{a.setAttribute('title',BRAND);a.setAttribute('aria-label',BRAND)});
    d.querySelectorAll('link[rel~="icon"],link[rel="shortcut icon"],link[rel="apple-touch-icon"],link[rel="apple-touch-icon-precomposed"]').forEach(l=>{l.setAttribute('href',ICON);l.setAttribute('type','image/svg+xml')});
    d.querySelectorAll('meta[name="theme-color"]').forEach(m=>m.setAttribute('content','#07100c'));

    const sourceTitle=brandText((d.title||'').trim());
    const pageTitle=IS_HOME?HOME_TITLE:(sourceTitle||BRAND);
    const sourceDesc=brandText((d.querySelector('meta[name="description"]')?.getAttribute('content')||'').trim());
    const pageDesc=sourceDesc||DEFAULT_DESC;
    d.title=pageTitle;
    const setMeta=(selector,attr,value)=>{let m=d.querySelector(selector);if(!m){m=d.createElement('meta');if(selector.includes('property=')){const k=selector.match(/property="([^"]+)/)?.[1];if(k)m.setAttribute('property',k)}else{const k=selector.match(/name="([^"]+)/)?.[1];if(k)m.setAttribute('name',k)}d.head.appendChild(m)}m.setAttribute(attr,value)};
    setMeta('meta[name="description"]','content',pageDesc);
    setMeta('meta[name="application-name"]','content',BRAND);
    setMeta('meta[name="apple-mobile-web-app-title"]','content',BRAND);
    setMeta('meta[property="og:title"]','content',pageTitle);
    setMeta('meta[property="og:description"]','content',pageDesc);
    setMeta('meta[property="og:site_name"]','content',BRAND);
    setMeta('meta[property="og:url"]','content',SITE+(IS_HOME?'/':PATH));
    setMeta('meta[name="twitter:title"]','content',pageTitle);
    setMeta('meta[name="twitter:description"]','content',pageDesc);
    setMeta('meta[property="og:image"]','content',SITE+FULL);
    setMeta('meta[name="twitter:image"]','content',SITE+FULL);
    d.querySelectorAll('meta[name="twitter:site"],meta[name="twitter:creator"]').forEach(m=>{if(/adsela|adselams|nashar\.digital/i.test(m.getAttribute('content')||''))m.remove()});
    d.querySelectorAll('link[rel="alternate"][hreflang]').forEach(l=>{if(/adselams\.com/i.test(l.getAttribute('href')||'')){const lang=(l.getAttribute('hreflang')||'').toLowerCase();l.setAttribute('href',lang==='en'?SITE+'/en/':SITE+'/')}});
    let canonical=d.querySelector('link[rel="canonical"]');
    if(!canonical){canonical=d.createElement('link');canonical.rel='canonical';d.head.appendChild(canonical)}
    canonical.href=SITE+(IS_HOME?'/':PATH);
    d.querySelectorAll('script[type="application/ld+json"]').forEach(s=>{if(/Adsela|ادسيلا|أدسيلا|adselams\.com|nashar\.digital/i.test(s.textContent||''))s.remove()});
    const schema=d.createElement('script');schema.type='application/ld+json';schema.dataset.nasharSchema='1';schema.textContent=JSON.stringify({'@context':'https://schema.org','@graph':[{'@type':'Organization','@id':SITE+'/#organization',name:BRAND,alternateName:ALT_BRAND,url:SITE+'/',logo:{'@type':'ImageObject',url:SITE+FULL,contentUrl:SITE+FULL,caption:BRAND}},{'@type':'WebSite','@id':SITE+'/#website',url:SITE+'/',name:BRAND,alternateName:ALT_BRAND,publisher:{'@id':SITE+'/#organization'},inLanguage:PATH.startsWith('/en')?'en':'ar'},{'@type':'WebPage','@id':SITE+(IS_HOME?'/':PATH)+'#webpage',url:SITE+(IS_HOME?'/':PATH),name:pageTitle,isPartOf:{'@id':SITE+'/#website'},about:{'@id':SITE+'/#organization'},inLanguage:PATH.startsWith('/en')?'en':'ar'}]});d.head.appendChild(schema);

    let out='<!DOCTYPE html>'+d.documentElement.outerHTML;
    const closeScript='</scr'+'ipt>';
    out=out.replace(fullRe,FULL).replace(iconRe,ICON);
    const homeUcss=IS_HOME?'<link rel="stylesheet" href="/origin/wp-content/litespeed/ucss/efedc5e60b2c472609156afd9951205c_ver%3Dd6958.css">':'';
    out=out.replace('</head>',
      '<link rel="icon" type="image/svg+xml" href="/assets/elnashargroup-icon-v3.svg">'+
      homeUcss+
      ''+
      '<link rel="stylesheet" href="/services-menu-fix.css?v=2">'+
      '<link rel="stylesheet" href="/media-layout-fix.css?v=3">'+
      '<link rel="stylesheet" href="/brand-layout.css?v=3">'+
      '</head>');
    out=out.replace('<script src="/assets-fix.js?v=3" defer></script></body>',
      '<script src="/assets-fix.js?v=16">'+closeScript+
      '<script src="/services-menu-fix.js?v=2">'+closeScript+
      '<script src="/brand-stability.js?v=1">'+closeScript+
      '<script src="/partners-owl-guard.js?v=2">'+closeScript+
      '</body>');
    document.open();document.write(out);document.close();
  }catch(e){
    console.error(e);
    const boot=document.getElementById('boot');
    if(boot)boot.innerHTML='<div style="padding:30px;font-family:Arial">تعذر تحميل الصفحة. أعد المحاولة.</div>';
  }
})();
</script>
</body>
</html>
